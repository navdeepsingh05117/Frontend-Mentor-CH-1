<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <!-- Connect to Google Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>

<!-- Load the Outfit Font -->
<link href="https://googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">


    <title>Frontend Mentor | QR code component</title>
    <link rel="stylesheet" href="style.css">
    
  </head>
  <body>
    <main class="card">
      <div id="qr">
        <img src="./images/image-qr-code.png" height="290px" width="280px" alt="qr-code" />
      </div>
      <h1 id="main-head">Improve your front-end skills by building projects</h1>
      <h3 id="sub-head">
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </h3>
    </main>

  </body>
</html>
